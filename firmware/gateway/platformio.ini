; ESP32 BLE gateway for the school platform.
; Build:  pio run          Flash:  pio run -t upload          Console:  pio device monitor
; Test the logic on a computer (no board needed):  pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -D FIRMWARE_VERSION=\"1.0.0\"
  -D MQTT_MAX_PACKET_SIZE=16384
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=0

; Runs lib/sightings (what the gateway does with what it hears) on the computer, with Unity.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
