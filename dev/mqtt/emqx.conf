## EMQX for development only: lets a gateway on your desk talk to the API on your computer.
## Started by dev/mqtt/compose.yml. See firmware/gateway/README.md, "Desk test with two ESP32s".
##
## Every login and every publish is checked by the API, as in production:
##   POST /api/gateway/mqtt/auth   a gateway logs in with its serial and secret
##   POST /api/gateway/mqtt/acl    a gateway may only publish to gw/<its serial>/...
## The API must run on port 3000 on this computer. If yours runs elsewhere, change both URLs.
## The hook secret below must match MQTT_HOOK_SECRET in apps/api/.env.

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://host.docker.internal:3000/api/gateway/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
    }
    headers {
      "content-type" = "application/json"
      "x-hook-secret" = "dev-hook-secret"
    }
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache.enable = false
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://host.docker.internal:3000/api/gateway/mqtt/acl"
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
        "x-hook-secret" = "dev-hook-secret"
      }
      request_timeout = "5s"
    }
  ]
}
